name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Academia Passivo Fiscal static route
        run: |
          mkdir -p dist/academia
          cat \
            academia-passivo-fiscal/part0.b64 \
            academia-passivo-fiscal/part1.b64 \
            academia-passivo-fiscal/part2.b64 \
            academia-passivo-fiscal/part3.b64 \
            academia-passivo-fiscal/part4.b64 \
            academia-passivo-fiscal/part5.b64 \
            academia-passivo-fiscal/part6a.b64 \
            academia-passivo-fiscal/part6b.b64 \
            academia-passivo-fiscal/part6c.b64 \
            academia-passivo-fiscal/part6d.b64 \
            academia-passivo-fiscal/part6e.b64 \
            academia-passivo-fiscal/part6f.b64 \
            academia-passivo-fiscal/part7.b64 \
            academia-passivo-fiscal/part8.b64 \
            | tr -d '\n\r\t ' \
            | base64 --decode > dist/academia/index.html
          test "$(wc -c < dist/academia/index.html)" -eq 36622
          grep -q "Transforme dívida fiscal em decisão estratégica." dist/academia/index.html

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
